<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Admin{% endblock %} — Dristhi Earth</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo-icon.png') }}">
  <style>
    /* ── Reset & variables ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #0A1A0C;
      --surface: #132015;
      --surface2: #0a1208;
      --border:  #1E3322;
      --text:    #F4F0E8;
      --muted:   #7A9B7E;
      --accent:  #4A9E5C;
      --gold:    #C8943A;
      --danger:  #c0392b;
      --font-sans: 'IBM Plex Sans', system-ui, sans-serif;
      --font-mono: 'IBM Plex Mono', 'Courier New', monospace;
      --font-serif: 'Playfair Display', Georgia, serif;
      --nav-h: 60px;
    }
    html { font-size: 15px; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-weight: 300;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }

    /* ── Top nav ── */
    .a-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      height: var(--nav-h);
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 32px;
    }
    .a-nav__brand {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-right: auto;
    }
    .a-nav__brand span { color: var(--gold); }
    .a-nav__link {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 4px 0;
      border-bottom: 1px solid transparent;
      transition: color 0.15s, border-color 0.15s;
    }
    .a-nav__link:hover { color: var(--text); }
    .a-nav__link.active { color: var(--text); border-bottom-color: var(--gold); }
    .a-nav__logout {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 5px 14px;
      transition: border-color 0.15s, color 0.15s;
    }
    .a-nav__logout:hover { border-color: var(--muted); color: var(--text); }

    /* Mobile nav collapse */
    .a-nav__links { display: flex; align-items: center; gap: 28px; }
    @media (max-width: 640px) {
      .a-nav { flex-wrap: wrap; height: auto; padding: 12px 16px; gap: 12px; }
      .a-nav__links { flex-wrap: wrap; gap: 14px; }
    }

    /* ── Main layout ── */
    .a-main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }

    /* ── Page header ── */
    .a-page-header { margin-bottom: 32px; }
    .a-page-header h1 {
      font-family: var(--font-serif);
      font-size: 1.8rem;
      font-weight: 400;
    }
    .a-page-header p {
      color: var(--muted);
      font-size: 0.88rem;
      margin-top: 4px;
    }

    /* ── Stat cards ── */
    .a-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--border); margin-bottom: 40px; }
    @media (max-width: 800px) { .a-stats { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 420px) { .a-stats { grid-template-columns: 1fr; } }
    .a-stat {
      background: var(--surface);
      padding: 28px 24px;
    }
    .a-stat__number {
      font-family: var(--font-serif);
      font-size: 2.4rem;
      color: var(--gold);
      display: block;
      line-height: 1;
      margin-bottom: 8px;
    }
    .a-stat__label {
      font-family: var(--font-mono);
      font-size: 0.62rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .a-stat--alert .a-stat__number { color: #e07070; }

    /* ── Table ── */
    .a-table-wrap { overflow-x: auto; }
    .a-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }
    .a-table thead tr {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .a-table th {
      font-family: var(--font-mono);
      font-size: 0.62rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 12px 16px;
      text-align: left;
      white-space: nowrap;
    }
    .a-table td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      vertical-align: top;
    }
    .a-table tbody tr:hover { background: var(--surface); }
    .a-table .muted { color: var(--muted); }
    .a-table .truncate { max-width: 280px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }

    /* ── Badges ── */
    .a-badge {
      font-family: var(--font-mono);
      font-size: 0.58rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 3px 8px;
      border: 1px solid;
      display: inline-block;
      white-space: nowrap;
    }
    .a-badge--yes  { color: var(--accent); border-color: var(--accent); }
    .a-badge--no   { color: var(--muted);  border-color: var(--border); }
    .a-badge--gold { color: var(--gold);   border-color: var(--gold); }

    /* ── Buttons ── */
    .a-btn {
      font-family: var(--font-mono);
      font-size: 0.62rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 5px 12px;
      border: 1px solid;
      cursor: pointer;
      background: transparent;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .a-btn--respond {
      color: var(--accent);
      border-color: var(--accent);
    }
    .a-btn--respond:hover {
      background: var(--accent);
      color: var(--bg);
    }
    .a-btn--undo {
      color: var(--muted);
      border-color: var(--border);
    }
    .a-btn--undo:hover {
      border-color: var(--muted);
      color: var(--text);
    }

    /* ── Login form ── */
    .a-login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .a-login-box {
      width: 100%;
      max-width: 400px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 48px 40px;
    }
    .a-login-box h1 {
      font-family: var(--font-serif);
      font-size: 1.5rem;
      font-weight: 400;
      margin-bottom: 6px;
    }
    .a-login-box p {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 32px;
    }
    .a-field { display: flex; flex-direction: column; gap: 7px; margin-bottom: 20px; }
    .a-label {
      font-family: var(--font-mono);
      font-size: 0.62rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .a-input {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      font-family: var(--font-sans);
      font-size: 0.9rem;
      width: 100%;
      transition: border-color 0.15s;
      border-radius: 0;
      -webkit-appearance: none;
    }
    .a-input:focus { outline: none; border-color: var(--accent); }
    .a-error {
      background: rgba(192, 57, 43, 0.1);
      border: 1px solid #c0392b;
      color: #e07070;
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 0.06em;
      padding: 10px 14px;
      margin-bottom: 20px;
    }
    .a-submit {
      width: 100%;
      background: var(--gold);
      color: var(--bg);
      border: 1px solid var(--gold);
      padding: 12px;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.15s;
    }
    .a-submit:hover { background: transparent; color: var(--gold); }

    /* ── Empty state ── */
    .a-empty {
      padding: 48px 24px;
      text-align: center;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border: 1px solid var(--border);
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=IBM+Plex+Sans:wght@300;400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

{% block body %}

<nav class="a-nav">
  <span class="a-nav__brand"><span>Dristhi Earth</span> — Admin</span>
  <div class="a-nav__links">
    <a href="{{ url_for('admin.dashboard') }}"   class="a-nav__link {% if request.endpoint == 'admin.dashboard'   %}active{% endif %}">Dashboard</a>
    <a href="{{ url_for('admin.contacts') }}"    class="a-nav__link {% if request.endpoint == 'admin.contacts'    %}active{% endif %}">Contacts</a>
    <a href="{{ url_for('admin.subscribers') }}" class="a-nav__link {% if request.endpoint == 'admin.subscribers' %}active{% endif %}">Subscribers</a>
    <a href="{{ url_for('admin.downloads') }}"   class="a-nav__link {% if request.endpoint == 'admin.downloads'   %}active{% endif %}">Downloads</a>
    <a href="{{ url_for('admin.logout') }}" class="a-nav__logout">Logout</a>
  </div>
</nav>

<main class="a-main">
  {% block content %}{% endblock %}
</main>

{% endblock %}

</body>
</html>
